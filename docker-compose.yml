version: '3.8'

services:
  # Mode 1: Standalone 24/7 Algorithmic Bot (Direct Delta Exchange connection)
  delta-standalone-bot:
    build: .
    container_name: delta_standalone_bot
    restart: always
    env_file:
      - .env
    command: python -m bot.standalone_bot
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

