services:
  # Autonomous Standalone Trading Bot (Delta Exchange 24/7 Engine + Live Dashboard)
  - type: web
    name: delta-trading-bot-standalone
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot.standalone_bot
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DELTA_ENVIRONMENT
        sync: false
      - key: DELTA_API_KEY
        sync: false
      - key: DELTA_API_SECRET
        sync: false
      - key: TRADING_SYMBOLS
        value: "ETHUSD,XAUTUSD"
      - key: TIMEFRAME
        value: "5m"
      - key: ORDER_SIZE
        value: "1"
      - key: LEVERAGE
        value: "130"
